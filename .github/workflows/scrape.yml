name: Collect Bay Wheels Data

on:
  schedule:
    # Runs automatically every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Adds a button so you can run it manually anytime

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GBFS collector
        run: python collect_data.py

      - name: Save updated CSV to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add carl_cole_availability.csv
          git diff --staged --quiet || git commit -m "Log station availability"
          git push
